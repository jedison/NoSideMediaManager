name: Verify MMM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Shared tests, macOS CLI, and iOS build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Select and diagnose Xcode
        run: |
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
      - name: Verify all MMM targets
        run: ./scripts/verify-mmm.sh
