name: NoSideMediaManager
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "12.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  NoSideMediaManager:
    type: library.static
    platform: macOS
    sources:
      - Sources/NoSideMediaManager
    settings:
      base:
        PRODUCT_MODULE_NAME: NoSideMediaManager
  NoSideMediaCompanionCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/NoSideMediaCompanionCore
    dependencies:
      - target: NoSideMediaManager
    settings:
      base:
        PRODUCT_MODULE_NAME: NoSideMediaCompanionCore
  microMM:
    type: application
    platform: macOS
    sources:
      - Sources/NoSideMediaManagerApp
      - path: Resources
        excludes:
          - "**/*.png"
    dependencies:
      - target: NoSideMediaManager
      - target: NoSideMediaCompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noside.micromm
        PRODUCT_NAME: microMM
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  noside-media:
    type: tool
    platform: macOS
    sources:
      - Sources/NoSideMediaCLI
    dependencies:
      - target: NoSideMediaManager
    settings:
      base:
        PRODUCT_NAME: noside-media
        OTHER_SWIFT_FLAGS: -parse-as-library
  NoSideMediaManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NoSideMediaManagerTests
        excludes:
          - Fixtures
      - path: Tests/NoSideMediaManagerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: NoSideMediaManager
      - target: NoSideMediaCompanionCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  microMMCompanion:
    type: application
    platform: iOS
    sources:
      - path: Companion iOS
        excludes:
          - Assets.xcassets
          - Info.plist
          - NoSideMediaCompanion.xcodeproj
          - README.md
    resources:
      - Companion iOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noside.mmmcompanion
        PRODUCT_NAME: NoSideMediaCompanion
        INFOPLIST_FILE: Companion iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  microMM:
    build:
      targets:
        microMM: all
        noside-media: all
        NoSideMediaManagerTests: [test]
    test:
      targets:
        - NoSideMediaManagerTests
  microMMCompanion:
    build:
      targets:
        microMMCompanion: all
